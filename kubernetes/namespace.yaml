apiVersion: v1
kind: Namespace
metadata:
  name: potato-disease-ml
  labels:
    name: potato-disease-ml
    app: mlops-pipeline
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mlops-config
  namespace: potato-disease-ml
data:
  MLFLOW_TRACKING_URI: "sqlite:///data/mlflow.db"
  MODEL_REGISTRY_URI: "sqlite:///data/mlflow.db"
  EXPERIMENT_NAME: "potato-disease-classification"
  MODEL_NAME: "potato-disease-model"
  KUBERNETES_NAMESPACE: "potato-disease-ml"
---
apiVersion: v1
kind: Secret
metadata:
  name: mlops-secrets
  namespace: potato-disease-ml
type: Opaque
data:
  # Base64 encoded secrets (to be filled by CI/CD)
  github-token: ""
  registry-password: ""
