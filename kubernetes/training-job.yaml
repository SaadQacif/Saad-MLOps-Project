apiVersion: batch/v1
kind: Job
metadata:
  name: model-training
  namespace: potato-disease-ml
  labels:
    app: model-training
    component: ml-pipeline
spec:
  template:
    metadata:
      labels:
        app: model-training
    spec:
      restartPolicy: Never
      containers:
      - name: training
        image: ghcr.io/qacifsaad/mlops-python:latest
        env:
        - name: MLFLOW_TRACKING_URI
          value: "http://mlflow-server:5000"
        - name: PYTHONPATH
          value: "/app"
        volumeMounts:
        - name: data-volume
          mountPath: /app/data
        - name: models-volume
          mountPath: /app/models
        command:
        - python
        - scripts/training_pipeline.py
        - --data-path
        - /app/data/processed
        - --output-path
        - /app/models
        - --experiment-name
        - potato-disease-classification
        resources:
          requests:
            memory: "2Gi"
            cpu: "1000m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
      volumes:
      - name: data-volume
        persistentVolumeClaim:
          claimName: data-pvc
      - name: models-volume
        persistentVolumeClaim:
          claimName: models-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data-pvc
  namespace: potato-disease-ml
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: models-pvc
  namespace: potato-disease-ml
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 5Gi
