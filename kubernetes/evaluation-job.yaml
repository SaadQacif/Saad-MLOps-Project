apiVersion: batch/v1
kind: Job
metadata:
  name: model-evaluation
  namespace: potato-disease-ml
  labels:
    app: model-evaluation
    component: ml-pipeline
spec:
  template:
    metadata:
      labels:
        app: model-evaluation
    spec:
      restartPolicy: Never
      containers:
      - name: evaluation
        image: ghcr.io/qacifsaad/mlops-python:latest
        env:
        - name: MLFLOW_TRACKING_URI
          value: "http://mlflow-server:5000"
        - name: PYTHONPATH
          value: "/app"
        volumeMounts:
        - name: data-volume
          mountPath: /app/data
        - name: models-volume
          mountPath: /app/models
        command:
        - python
        - scripts/evaluation_pipeline.py
        - --model-path
        - /app/models
        - --test-data-path
        - /app/data/split/test
        - --experiment-name
        - potato-disease-classification
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
      volumes:
      - name: data-volume
        persistentVolumeClaim:
          claimName: data-pvc
      - name: models-volume
        persistentVolumeClaim:
          claimName: models-pvc
