apiVersion: batch/v1
kind: Job
metadata:
  name: data-preprocessing
  namespace: potato-disease-ml
  labels:
    app: potato-disease-classification
    component: data-preprocessing
    pipeline-stage: "1"
spec:
  template:
    metadata:
      labels:
        app: potato-disease-classification
        component: data-preprocessing
    spec:
      restartPolicy: Never
      containers:
      - name: data-preprocessing
        image: potato-disease-training:latest
        env:
        - name: MLFLOW_TRACKING_URI
          valueFrom:
            configMapKeyRef:
              name: mlops-config
              key: MLFLOW_TRACKING_URI
        - name: KUBERNETES_NAMESPACE
          valueFrom:
            configMapKeyRef:
              name: mlops-config
              key: KUBERNETES_NAMESPACE
        - name: PIPELINE_VERSION
          value: "v1.0.0"
        - name: PIPELINE_STEP
          value: "data-preprocessing"
        volumeMounts:
        - name: data-volume
          mountPath: /app/data
        - name: raw-data-volume
          mountPath: /app/Potato_Health_States
          readOnly: true
        command:
        - python
        - scripts/training_pipeline_k8s.py
        - --steps
        - data_preprocessing
        - --pipeline-version
        - "v1.0.0"
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
      volumes:
      - name: data-volume
        persistentVolumeClaim:
          claimName: data-pvc
      - name: raw-data-volume
        persistentVolumeClaim:
          claimName: raw-data-pvc
---
