apiVersion: batch/v1
kind: Job
metadata:
  name: model-training
  namespace: potato-disease-ml
  labels:
    app: potato-disease-classification
    component: model-training
    pipeline-stage: "3"
spec:
  template:
    metadata:
      labels:
        app: potato-disease-classification
        component: model-training
    spec:
      restartPolicy: Never
      containers:
      - name: model-training
        image: potato-disease-training:latest
        env:
        - name: MLFLOW_TRACKING_URI
          value: "http://mlflow-server:5000"
        - name: KUBERNETES_NAMESPACE
          valueFrom:
            configMapKeyRef:
              name: mlops-config
              key: KUBERNETES_NAMESPACE
        - name: PIPELINE_VERSION
          value: "v1.0.0"
        - name: PIPELINE_STEP
          value: "model-training"
        volumeMounts:
        - name: data-volume
          mountPath: /app/data
        - name: models-volume
          mountPath: /app/models
        - name: mlflow-volume
          mountPath: /app/mlruns
        command:
        - python
        - scripts/training_pipeline_k8s.py
        - --steps
        - model_training
        - --pipeline-version
        - "v1.0.0"
        resources:
          requests:
            memory: "4Gi"
            cpu: "2000m"
          limits:
            memory: "8Gi"
            cpu: "4000m"
      volumes:
      - name: data-volume
        persistentVolumeClaim:
          claimName: data-pvc
      - name: models-volume
        persistentVolumeClaim:
          claimName: models-pvc
      - name: mlflow-volume
        persistentVolumeClaim:
          claimName: mlflow-pvc
