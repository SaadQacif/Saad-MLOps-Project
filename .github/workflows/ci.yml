name: CI for ML Pipeline

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # tests import both `scripts.<module>` (repo root) and modules from scripts/ and src/
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/scripts:${{ github.workspace }}/src

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python (same version as the Docker images)
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install system libraries for OpenCV
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Dataset creation tests
        run: pytest tests/test_mlflow_dataset.py

      - name: Preprocessing tests
        run: pytest tests/test_preprocessing.py

      - name: Training tests
        run: pytest tests/test_training.py

      - name: Prediction tests
        run: pytest tests/test_predictions.py

      - name: Upload workflow output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow_output
          path: workflow_output/
          if-no-files-found: ignore
