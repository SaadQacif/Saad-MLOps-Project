name: CI for ML Pipeline

on:
  push:
    branches: [main]

jobs:
  checkout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

  system_deps:
    runs-on: ubuntu-latest
    needs: checkout
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-opencv

  python_deps:
    runs-on: ubuntu-latest
    needs: system_deps
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

  set_pythonpath:
    runs-on: ubuntu-latest
    needs: python_deps
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set PYTHONPATH
        run: echo "PYTHONPATH=$PYTHONPATH:$(pwd)/scripts:$(pwd)/src" >> $GITHUB_ENV

  dataset_creation:
    runs-on: ubuntu-latest
    needs: set_pythonpath
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set PYTHONPATH
        run: echo "PYTHONPATH=$PYTHONPATH:$(pwd)/scripts:$(pwd)/src" >> $GITHUB_ENV
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run dataset creation tests
        run: pytest tests/test_mlflow_dataset.py

  preprocessing:
    runs-on: ubuntu-latest
    needs: dataset_creation
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set PYTHONPATH
        run: echo "PYTHONPATH=$PYTHONPATH:$(pwd)/scripts:$(pwd)/src" >> $GITHUB_ENV
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run preprocessing tests
        run: pytest tests/test_preprocessing.py

  training:
    runs-on: ubuntu-latest
    needs: preprocessing
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set PYTHONPATH
        run: echo "PYTHONPATH=$PYTHONPATH:$(pwd)/scripts:$(pwd)/src" >> $GITHUB_ENV
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run training tests
        run: pytest tests/test_training.py

  predictions:
    runs-on: ubuntu-latest
    needs: training
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set PYTHONPATH
        run: echo "PYTHONPATH=$PYTHONPATH:$(pwd)/scripts:$(pwd)/src" >> $GITHUB_ENV
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run prediction tests
        run: pytest tests/test_predictions.py

  workflow_outputs:
    runs-on: ubuntu-latest
    needs: predictions
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Upload workflow output (optional)
        uses: actions/upload-artifact@v4
        with:
          name: workflow_output
          path: workflow_output/