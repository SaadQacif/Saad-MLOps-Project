name: CD for Potato Project

# Builds the docker-compose stack (MLflow + Streamlit) after a successful CI run on
# main, waits for both health checks, smoke-tests the endpoints from inside the
# runner and tears the stack down. Nothing is exposed outside the runner.
# On other branches the same check runs whenever the container setup changes.

on:
  workflow_run:
    workflows: ["CI for ML Pipeline"]
    types: [completed]
    branches: [main]
  push:
    branches-ignore: [main]
    paths:
      - "Dockerfile*"
      - "docker-compose.yml"
      - "requirements*.txt"
      - ".github/workflows/cd.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-smoke-test:
    # after CI: only commits whose CI passed, and only for pushes (not pull requests)
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout (the commit CI tested, when triggered by CI)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Build images
        run: docker compose -f docker-compose.yml build

      - name: Start containers
        run: docker compose -f docker-compose.yml up -d

      - name: Wait for both containers to be healthy
        run: |
          for i in $(seq 1 40); do
            ML=$(docker inspect --format='{{.State.Health.Status}}' potato-mlflow)
            FE=$(docker inspect --format='{{.State.Health.Status}}' potato-frontend)
            echo "attempt $i: mlflow=$ML frontend=$FE"
            if [ "$ML" = "healthy" ] && [ "$FE" = "healthy" ]; then
              exit 0
            fi
            sleep 10
          done
          echo "containers did not become healthy in time" >&2
          exit 1

      - name: Smoke-test the endpoints
        run: |
          curl -fsS http://localhost:5000/health
          curl -fsS http://localhost:8501/_stcore/health

      - name: Show container status and logs
        if: failure()
        run: |
          docker compose -f docker-compose.yml ps
          docker compose -f docker-compose.yml logs --tail=200

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml down -v
